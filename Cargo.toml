# Workspace root: every Rust service in protOS is a member crate here.
# One lock file and one target/ directory serve all of them, and the
# shared settings below are inherited with `key.workspace = true`.
[workspace]
resolver = "3"
members = ["facegen", "facegen/demo", "piomatter-sys"]
# The browser demo only builds for wasm32; native cargo commands skip it.
default-members = ["facegen", "piomatter-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

# Version pins shared across members; a crate opts in with
# `name = { workspace = true }` and may add features of its own.
[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
bytemuck = { version = "1.25", features = ["derive"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
glam = "0.33"
naga = { version = "30.0", features = ["wgsl-in"] }
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
png = "0.18"
rosc = "0.11"
pollster = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-time = "1.1"
# Backends are chosen per target in facegen/Cargo.toml: Vulkan on
# native (the GL backend's EGL enumeration panics on Pi OS), WebGPU on
# wasm.
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl"] }
