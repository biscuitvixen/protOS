[package]
name = "facegen"
description = "GPU-rendered procedural protogen face for protOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
clap.workspace = true
glam.workspace = true
naga.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
web-time.workspace = true
wgpu.workspace = true

# Native only: the OSC bus, the browser harness, file watching, PNGs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum.workspace = true
bytes.workspace = true
notify.workspace = true
png.workspace = true
pollster.workspace = true
rosc.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "web"] }

[dev-dependencies]
png.workspace = true

[features]
# Drive HUB75 panels through Adafruit Piomatter on a Raspberry Pi 5.
# Links GPL-2.0-only code; see piomatter-sys.
piomatter = ["dep:piomatter-sys"]

[dependencies.piomatter-sys]
path = "../piomatter-sys"
optional = true
